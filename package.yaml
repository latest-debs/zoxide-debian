# Package definition for zoxide

package_name: zoxide
github_repo: ajeetdsouza/zoxide
license: MIT
artifact_format: tar.gz
description: "A smarter cd command for your terminal"
license: MIT

# Build for all Debian suites and all supported architectures.

# Opt into native Ubuntu builds (builder >= v.0.1a29). Packages without
# these are served from the Debian suites via the alias fallback.
ubuntu_distributions:
  - jammy
  - noble
  - resolute
